    path: hierarchy/FrameLayout[0]/LinearLayout[0]/FrameLayout[0]/FrameLayout[0]/FrameLayout[1]/FrameLayout[1]/FrameLayout[0]/FrameLayout[1]/FrameLayout[0]/FrameLayout[5]/FrameLayout[0]/FrameLayout[1]/ViewGroup[0]/LinearLayout[1]/RelativeLayout[1]/FrameLayout[1]/FrameLayout[0]/LinearLayout[0]/LinearLayout[2]/LinearLayout[0]/Button[1]
