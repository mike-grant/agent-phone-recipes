# SAVES TO DRAFTS ONLY — NEVER PUBLISHES. `forbid` refuses taps on Post / Your Story.
# Usage: agent-phone run tiktok/carousel-draft --param images=DIR --param caption_file=PATH
#   or:  agent-phone tiktok-draft DIR [--caption TEXT | --caption-file PATH]
name: tiktok/carousel-draft
version: 3
app: com.zhiliaoapp.musically
description: Post a photo carousel from a folder of images to TikTok DRAFTS. Saves
  to Drafts only — never publishes.
tested:
  date: '2026-10-21'
  app_version: 47.1.4
min_engine: 0.3.0
params:
  images:
    type: dir
    required: true
    description: Local folder of slide images
  caption:
    required: true
    description: 'Caption text (CLI: pass caption_file=PATH instead)'
  caption_file:
    type: file
    default: ''
    description: 'Alternative to caption: path of a text file'
forbid:
- text: Post
- resource_id_suffix: tiq
- resource_id_suffix: tl8
- text: Your Story
- resource_id_suffix: tv_quick_publish
popups:
- text: Don’t allow
- text: Don't allow
- text: Not now
steps:
- id: s1
  intent: Push the slide images to the phone as one gallery album (first slide newest)
    and count them
  action: push_images
  value: '{{images}}'
  exclude:
  - sheet.*
  - '*contact*'
  max: 35
  optional: false
  retries: 0
- id: s2
  intent: Force-stop and relaunch TikTok so we start from the home feed, not a leftover editor or draft
  action: app
  restart: true
  target: null
  value: com.zhiliaoapp.musically
  expect:
    any_of:
    - content_desc: Create
    - content_desc: Home
    - resource_id: com.zhiliaoapp.musically:id/a3l
    - resource_id: com.zhiliaoapp.musically:id/v8a
    - resource_id: com.zhiliaoapp.musically:id/v8d
    - resource_id: com.zhiliaoapp.musically:id/a3k
    - resource_id: com.zhiliaoapp.musically:id/v4t
    - resource_id: com.zhiliaoapp.musically:id/v4w
    timeout: 20
  optional: false
  retries: 2
- id: s3
  intent: Dismiss any permission/contacts popup (always prefer 'Don’t allow')
  action: dismiss_if_present
  targets:
  - text: Don’t allow
  - text: Don't allow
  - text: Not now
  timeout: 2
  optional: true
  retries: 0
- id: s4
  intent: Tap the Create (+) button in the bottom navigation
  action: tap
  target:
    resource_id: com.zhiliaoapp.musically:id/opd
    text: ''
    content_desc: Create
    class: android.widget.Button
    path: hierarchy/FrameLayout[0]/LinearLayout[0]/FrameLayout[0]/FrameLayout[0]/FrameLayout[1]/FrameLayout[0]/FrameLayout[0]/05rd[0]/TabHost[0]/FrameLayout[1]/LinearLayout[3]/Button[2]
    rel_pos:
    - 0.5
    - 0.9142
    context:
      ancestor_text: ''
      sibling_texts:
      - Home
      - Shop
      - Inbox
      - Profile
      parent_path: hierarchy/FrameLayout[0]/LinearLayout[0]/FrameLayout[0]/FrameLayout[0]/FrameLayout[1]/FrameLayout[0]/FrameLayout[0]/05rd[0]/TabHost[0]/FrameLayout[1]/LinearLayout[3]
      orientation: portrait
    bounds:
    - 576
    - 2620
    - 864
    - 2792
    center:
    - 720
    - 2706
  value: null
  expect:
    any_of:
    - resource_id: com.zhiliaoapp.musically:id/video_record_new_scene_root
    - resource_id: com.zhiliaoapp.musically:id/upload_hot_area
    - content_desc: Flip
    - text: Flip
    - resource_id: com.zhiliaoapp.musically:id/pxa
    - resource_id: com.zhiliaoapp.musically:id/n82
    - resource_id: com.zhiliaoapp.musically:id/puj
    - resource_id: com.zhiliaoapp.musically:id/n5g
    timeout: 10
  optional: false
  retries: 2
- id: s5
  intent: Open the gallery picker via the upload thumbnail (bottom left)
  action: tap
  target:
    resource_id: com.zhiliaoapp.musically:id/upload_hot_area
    text: ''
    content_desc: ''
    class: android.widget.FrameLayout
    path: hierarchy/FrameLayout[0]/LinearLayout[0]/FrameLayout[0]/FrameLayout[0]/FrameLayout[1]/FrameLayout[1]/FrameLayout[0]/FrameLayout[1]/FrameLayout[0]/FrameLayout[4]/FrameLayout[0]/FrameLayout[1]/FrameLayout[0]/FrameLayout[0]/FrameLayout[3]/FrameLayout[6]/FrameLayout[2]/RelativeLayout[0]/FrameLayout[0]
    rel_pos:
