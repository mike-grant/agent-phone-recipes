name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # agent-phone is installed from GitHub, so this needs that repo to be public.
    # Enable with: gh variable set AGENT_PHONE_PUBLIC --body true
    if: ${{ vars.AGENT_PHONE_PUBLIC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate recipes (strict) and check index.json is current
        run: uvx --from "agent-phone @ git+https://github.com/mike-grant/agent-phone" agent-phone recipe index . --check
